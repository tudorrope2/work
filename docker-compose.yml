version: '3.8'

services:
  backend:
    build: .
    ports:
      - "5000:5000"

  frontend:
    image: nginx:alpine
    ports:
      # 호스트 8080 접속 -> Nginx 80 전달
      - "8080:80"
    volumes:
      # 같은 폴더의 html과 설정 파일을 Nginx 컨테이너 안으로 연결
      - ./index.html:/usr/share/nginx/html/index.html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend