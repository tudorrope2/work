<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>학과 익명 Q&A 게시판</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; max-width: 600px; margin: 0 auto; padding: 20px; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        
        .input-group { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .category-select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 15px; }
        textarea { width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 5px; padding: 12px; font-size: 15px; resize: vertical; margin-bottom: 10px; }
        .main-btn { background-color: #3498db; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
        
        /* 상단 바 (검색 및 정렬) */
        .control-bar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
        .search-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .sort-select { padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; background: white; cursor: pointer; }
        
        .question-box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; position: relative; }
        
        /* 상단 메타 정보 (뱃지, 시간, 삭제 버튼) */
        .box-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-left { display: flex; align-items: center; gap: 8px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; }
        .badge-exam { background-color: #e74c3c; } 
        .badge-hw { background-color: #f39c12; } 
        .badge-etc { background-color: #95a5a6; } 
        .time-text { font-size: 12px; color: #888; }
        
        .delete-btn { background: none; border: none; color: #ccc; cursor: pointer; font-size: 14px; }
        .delete-btn:hover { color: #e74c3c; }

        .question-content { font-size: 16px; margin: 0 0 15px 0; line-height: 1.5; font-weight: 500; }
        .like-btn { cursor: pointer; background-color: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 13px; margin-bottom: 15px; }
        
        .comments-section { border-top: 1px solid #f0f0f0; padding-top: 12px; }
        .comment-item { background-color: #f8f9fa; padding: 8px 12px; border-radius: 5px; font-size: 14px; margin-bottom: 5px; color: #555; }
        .comment-input-group { display: flex; gap: 8px; }
        .comment-input-group input { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .comment-btn { padding: 8px 15px; font-size: 13px; background-color: #2ecc71; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>💬 학과 익명 Q&A 게시판</h2>

    <!-- 질문 작성 영역 -->
    <div class="input-group">
        <select id="categorySelect" class="category-select">
            <option value="시험">🔥 시험 관련</option>
            <option value="과제">📝 과제 관련</option>
            <option value="기타">💬 기타 질문</option>
        </select>
        <textarea id="questionInput" rows="3" placeholder="궁금한 점을 자유롭게 남겨주세요..."></textarea>
        <button class="main-btn" onclick="submitQuestion()">질문 등록</button>
    </div>

    <!-- 검색 및 정렬 제어 바 -->
    <div class="control-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="질문 내용 검색..." onkeyup="if(event.key === 'Enter') loadQuestions()">
        <select id="sortSelect" class="sort-select" onchange="loadQuestions()">
            <option value="latest">최신순</option>
            <option value="likes">인기순(공감)</option>
        </select>
    </div>

    <!-- 질문 목록 조회 영역 -->
    <div id="questionList"></div>

    <script>
        document.addEventListener('DOMContentLoaded', loadQuestions);

        async function submitQuestion() {
            const inputElement = document.getElementById('questionInput');
            const categoryElement = document.getElementById('categorySelect');
            const content = inputElement.value.trim();
            const category = categoryElement.value;

            if (!content) {
                alert("내용을 입력하세요.");
                return;
            }

            const response = await fetch('/api/questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content, category: category })
            });

            if (response.ok) {
                inputElement.value = ''; 
                loadQuestions();
            }
        }

        async function loadQuestions() {
            const searchKeyword = document.getElementById('searchInput').value.trim();
            const sortType = document.getElementById('sortSelect').value;

            const response = await fetch(`/api/questions?search=${encodeURIComponent(searchKeyword)}&sort=${sortType}`);
            const questions = await response.json();
            const listElement = document.getElementById('questionList');

            listElement.innerHTML = ''; 

            if (questions.length === 0) {
                listElement.innerHTML = '<p style="text-align: center; color: #999;">등록된 질문이 없습니다.</p>';
                return;
            }

            questions.forEach(q => {
                const commentsHtml = q.comments.map(c => `<div class="comment-item">↳ ${c}</div>`).join('');
                
                let badgeClass = 'badge-etc';
                if(q.category === '시험') badgeClass = 'badge-exam';
                else if(q.category === '과제') badgeClass = 'badge-hw';

                const div = document.createElement('div');
                div.className = 'question-box';
                div.innerHTML = `
                    <div class="box-header">
                        <div class="header-left">
                            <span class="badge ${badgeClass}">${q.category}</span>
                            <span class="time-text">${q.created_at}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteQuestion(${q.id})" title="삭제">✖</button>
                    </div>
                    <p class="question-content">${q.content}</p>
                    <button class="like-btn" onclick="likeQuestion(${q.id}, this)">👍 공감 ${q.likes}</button>
                    
                    <div class="comments-section">
                        <div class="comment-list">${commentsHtml}</div>
                        <div class="comment-input-group">
                            <input type="text" id="commentInput-${q.id}" placeholder="댓글 달기..." onkeyup="if(event.key === 'Enter') submitComment(${q.id})">
                            <button class="comment-btn" onclick="submitComment(${q.id})">등록</button>
                        </div>
                    </div>
                `;
                listElement.appendChild(div);
            });
        }

        async function deleteQuestion(questionId) {
            if (!confirm("정말 이 질문을 삭제하시겠습니까?")) return;
            const response = await fetch(`/api/questions/${questionId}`, { method: 'DELETE' });
            if (response.ok) {
                loadQuestions();
            } else {
                alert("삭제에 실패했습니다.");
            }
        }

        async function likeQuestion(questionId, buttonElement) {
            buttonElement.disabled = true;
            const response = await fetch(`/api/questions/${questionId}/like`, { method: 'POST' });
            if (response.ok) {
                loadQuestions(); 
            } else {
                buttonElement.disabled = false; 
            }
        }

        async function submitComment(questionId) {
            const inputElement = document.getElementById(`commentInput-${questionId}`);
            const content = inputElement.value.trim();

            if (!content) {
                alert("댓글을 입력하세요.");
                return;
            }

            const response = await fetch(`/api/questions/${questionId}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });

            if (response.ok) {
                loadQuestions(); 
            }
        }
    </script>
</body>
</html>
