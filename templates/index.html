<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>typing.arena</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --text-muted: #a1a1aa;
            --border: #e4e4e7;
            --accent: #18181b;
            --error: #dc2626;
            --error-bg: #fef2f2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-primary);
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
            -webkit-font-smoothing: antialiased;
        }

        .wrapper {
            width: 100%;
            max-width: 720px;
        }

        /* 상단 헤더 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 48px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand span {
            color: var(--text-muted);
            font-weight: 400;
        }

        /* 로비 화면 */
        .lobby-box {
            max-width: 360px;
            margin: 0 auto;
        }

        .lobby-title {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .lobby-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            padding: 11px 14px;
            font-size: 15px;
            font-family: inherit;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }

        .field input:focus {
            border-color: var(--text-primary);
        }

        /* 버튼 스타일 */
        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 11px 20px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            border: 1px solid transparent;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            background: #27272a;
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            padding: 6px 10px;
            font-size: 13px;
        }

        .btn-ghost:hover {
            color: var(--text-primary);
            background: #f4f4f5;
        }

        .btn-outline {
            background: var(--surface);
            border-color: var(--border);
            color: var(--text-primary);
        }

        .btn-outline:hover {
            border-color: var(--text-primary);
        }

        /* 게임 방 메타 정보 */
        .room-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .metrics {
            display: flex;
            gap: 24px;
            font-variant-numeric: tabular-nums;
        }

        .metric-item strong {
            color: var(--text-primary);
            font-weight: 600;
            margin-left: 6px;
        }

        /* 타이핑 영역 (typing.works 스타일) */
        .typing-area {
            position: relative;
            margin-bottom: 32px;
            cursor: text;
        }

        #sentenceDisplay {
            font-size: 21px;
            line-height: 1.85;
            letter-spacing: -0.01em;
            color: var(--text-muted);
            word-break: keep-all;
            min-height: 120px;
            user-select: none;
        }

        .char-correct {
            color: var(--text-primary);
        }

        .char-incorrect {
            color: var(--error);
            background-color: var(--error-bg);
            border-radius: 2px;
        }

        .char-current {
            position: relative;
            color: var(--text-muted);
        }

        .char-current::before {
            content: "";
            position: absolute;
            left: 0;
            top: 3px;
            bottom: 3px;
            width: 2px;
            background-color: var(--text-primary);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* 화면에 보이지 않는 실제 입력창 */
        #hiddenInput {
            position: absolute;
            opacity: 0;
            pointer-events: none;
            width: 1px;
            height: 1px;
        }

        .focus-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 12px;
            height: 18px;
        }

        /* 인라인 결과 배너 */
        .result-banner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 32px;
        }

        .result-info {
            font-size: 14px;
        }

        .result-info .winner {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .result-info .detail {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        /* 참가자 및 실시간 진척도 */
        .participants-section {
            border-top: 1px solid var(--border);
            padding-top: 24px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
        }

        .player-row {
            margin-bottom: 14px;
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 6px;
            font-variant-numeric: tabular-nums;
        }

        .player-name {
            color: var(--text-primary);
            font-weight: 500;
        }

        .player-pct {
            color: var(--text-secondary);
        }

        .track {
            width: 100%;
            height: 2px;
            background: var(--border);
            overflow: hidden;
        }

        .fill {
            height: 100%;
            background: var(--text-primary);
            width: 0%;
            transition: width 0.12s ease-out;
        }

        .control-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 24px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="brand">typing.arena <span>/ multiplayer</span></div>
            <div id="headerAction" class="hidden">
                <button class="btn btn-ghost" onclick="leaveRoom()">나가기</button>
            </div>
        </header>

        <!-- 로비 화면 -->
        <div id="lobby" class="lobby-box">
            <div class="lobby-title">방 입장</div>
            <div class="lobby-desc">동일한 방 코드를 입력해 실시간으로 문장을 입력합니다.</div>

            <div class="field">
                <label for="nicknameInput">닉네임</label>
                <input type="text" id="nicknameInput" placeholder="표시될 이름" autocomplete="off">
            </div>

            <div class="field">
                <label for="roomInput">방 코드</label>
                <input type="text" id="roomInput" value="room1" placeholder="예: room1" autocomplete="off">
            </div>

            <button class="btn btn-primary" onclick="joinRoom()">입장하기</button>
        </div>

        <!-- 게임 방 화면 -->
        <div id="gameRoom" class="hidden">
            <div class="room-meta">
                <div id="roomInfo">room1 · -</div>
                <div class="metrics">
                    <div class="metric-item">타수<strong id="cpmDisplay">0</strong></div>
                    <div class="metric-item">정확도<strong id="accDisplay">100%</strong></div>
                </div>
            </div>

            <!-- 완주 결과 인라인 배너 -->
            <div id="resultBanner" class="result-banner hidden">
                <div class="result-info">
                    <div class="winner" id="resultTitle">-</div>
                    <div class="detail" id="resultDetail">-</div>
                </div>
                <button class="btn btn-outline" onclick="startGame()">다시 시작</button>
            </div>

            <!-- 문장 출력 및 인라인 타이핑 영역 -->
            <div class="typing-area" onclick="focusInput()">
                <div id="sentenceDisplay">시작 버튼을 누르면 문장이 표시됩니다.</div>
                <input type="text" id="hiddenInput" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" disabled oninput="checkTyping()">
                <div class="focus-hint" id="focusHint"></div>
            </div>

            <div class="control-bar">
                <button id="startBtn" class="btn btn-outline" onclick="startGame()">게임 시작</button>
            </div>

            <!-- 실시간 진척도 -->
            <div class="participants-section">
                <div class="section-label">
                    <span>참가자 진척도</span>
                    <span id="userCount">0명</span>
                </div>
                <div id="progressContainer"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = '';
        let currentNickname = '';
        let targetText = '';
        let gameActive = false;
        let hasPlayedOnce = false;
        let startTime = null;
        let finalCpm = 0;
        let finalAccuracy = 100;

        const hiddenInput = document.getElementById('hiddenInput');

        // 포커스 안내 문구 제어
        hiddenInput.addEventListener('blur', () => {
            if (gameActive) {
                document.getElementById('focusHint').innerText = '계속 입력하려면 문장 영역을 클릭하세요.';
            }
        });
        hiddenInput.addEventListener('focus', () => {
            document.getElementById('focusHint').innerText = '';
        });

        function focusInput() {
            if (gameActive) {
                hiddenInput.focus();
            }
        }

        function joinRoom() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const room = document.getElementById('roomInput').value.trim();
            if (!nickname || !room) {
                alert('닉네임과 방 코드를 입력해주세요.');
                return;
            }
            currentNickname = nickname;
            currentRoom = room;
            hasPlayedOnce = false;
            gameActive = false;
            targetText = '';

            const startBtn = document.getElementById('startBtn');
            startBtn.innerText = '게임 시작';
            startBtn.classList.remove('hidden');

            document.getElementById('resultBanner').classList.add('hidden');
            document.getElementById('sentenceDisplay').innerText = '시작 버튼을 누르면 문장이 표시됩니다.';
            document.getElementById('cpmDisplay').innerText = '0';
            document.getElementById('accDisplay').innerText = '100%';
            document.getElementById('focusHint').innerText = '';

            hiddenInput.value = '';
            hiddenInput.disabled = true;

            socket.emit('join', { nickname: nickname, room: room });

            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameRoom').classList.remove('hidden');
            document.getElementById('headerAction').classList.remove('hidden');
            document.getElementById('roomInfo').innerText = `${room} · ${nickname}`;
        }

        function leaveRoom() {
            if (currentRoom && currentNickname) {
                socket.emit('leave', { nickname: currentNickname, room: currentRoom });
            }
            gameActive = false;
            hasPlayedOnce = false;
            targetText = '';
            currentRoom = '';

            document.getElementById('resultBanner').classList.add('hidden');
            document.getElementById('gameRoom').classList.add('hidden');
            document.getElementById('headerAction').classList.add('hidden');
            document.getElementById('lobby').classList.remove('hidden');
        }

        function startGame() {
            socket.emit('start_game', { room: currentRoom });
        }

        socket.on('update_users', (users) => {
            document.getElementById('userCount').innerText = `${users.length}명`;
        });

        socket.on('game_started', (data) => {
            targetText = data.sentence;
            gameActive = true;
            hasPlayedOnce = true;
            startTime = new Date().getTime();

            document.getElementById('resultBanner').classList.add('hidden');
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('focusHint').innerText = '';

            hiddenInput.value = '';
            hiddenInput.disabled = false;
            hiddenInput.focus();

            renderSentence();
            document.getElementById('cpmDisplay').innerText = '0';
            document.getElementById('accDisplay').innerText = '100%';
        });

        function renderSentence() {
            let html = '';
            const typedVal = hiddenInput.value;

            for (let i = 0; i < targetText.length; i++) {
                const char = targetText[i] === ' ' ? '&nbsp;' : targetText[i];
                if (i < typedVal.length) {
                    if (typedVal[i] === targetText[i]) {
                        html += `<span class="char-correct">${char}</span>`;
                    } else {
                        html += `<span class="char-incorrect">${char}</span>`;
                    }
                } else if (i === typedVal.length) {
                    html += `<span class="char-current">${char}</span>`;
                } else {
                    html += `<span>${char}</span>`;
                }
            }
            document.getElementById('sentenceDisplay').innerHTML = html;
        }

        function checkTyping() {
            if (!gameActive || !targetText) return;
            const typed = hiddenInput.value;

            let correctCount = 0;
            let errorCount = 0;

            for (let i = 0; i < typed.length; i++) {
                if (i < targetText.length) {
                    if (typed[i] === targetText[i]) {
                        correctCount++;
                    } else {
                        errorCount++;
                        break;
                    }
                }
            }

            renderSentence();

            const currentTime = new Date().getTime();
            const elapsedMinutes = (currentTime - startTime) / 60000;
            finalCpm = elapsedMinutes > 0 ? Math.floor(correctCount / elapsedMinutes) : 0;
            finalAccuracy = typed.length > 0 ? Math.max(0, Math.floor(((typed.length - errorCount) / typed.length) * 100)) : 100;

            document.getElementById('cpmDisplay').innerText = finalCpm;
            document.getElementById('accDisplay').innerText = `${finalAccuracy}%`;

            let progress = Math.floor((correctCount / targetText.length) * 100);
            if (progress > 100) progress = 100;

            socket.emit('user_progress', { room: currentRoom, nickname: currentNickname, progress: progress });

            if (targetText.length > 0 && typed.length > 0 && typed.trim() === targetText.trim()) {
                gameActive = false;
                hiddenInput.disabled = true;

                socket.emit('finish_game', {
                    room: currentRoom,
                    nickname: currentNickname,
                    cpm: finalCpm,
                    accuracy: finalAccuracy
                });

                showResult(`${currentNickname} 완주`, `${finalCpm} 타/분 · 정확도 ${finalAccuracy}%`);
            }
        }

        socket.on('player_finished', (data) => {
            if (data.nickname !== currentNickname) {
                gameActive = false;
                hiddenInput.disabled = true;
                showResult(`${data.nickname} 완주`, `${data.cpm} 타/분 · 정확도 ${data.accuracy}%`);
            }
        });

        function showResult(title, detail) {
            document.getElementById('resultTitle').innerText = title;
            document.getElementById('resultDetail').innerText = detail;
            document.getElementById('resultBanner').classList.remove('hidden');
        }

        socket.on('update_progress', (usersProgress) => {
            const container = document.getElementById('progressContainer');
            container.innerHTML = '';
            for (let user in usersProgress) {
                let p = usersProgress[user];
                container.innerHTML += `
                    <div class="player-row">
                        <div class="player-header">
                            <span class="player-name">${user}</span>
                            <span class="player-pct">${p}%</span>
                        </div>
                        <div class="track">
                            <div class="fill" style="width: ${p}%;"></div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
