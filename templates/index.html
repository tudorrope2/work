<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 멀티 타이핑 아레나</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 700px;
        }
        h2 { text-align: center; color: #38bdf8; margin-top: 0; }
        .box { margin-bottom: 20px; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus { border-color: #38bdf8; }
        
        /* 타이핑 문장 스타일링 */
        #sentenceDisplay {
            font-size: 20px;
            line-height: 1.6;
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            word-break: break-all;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .char-correct { color: #34d399; font-weight: bold; } /* 맞춘 글자 (초록색) */
        .char-incorrect { color: #f87171; background: rgba(248,113,113,0.2); } /* 오타 */
        .char-normal { color: #94a3b8; } /* 남은 글자 (회색) */

        /* 게이지바 스타일 */
        .progress-container {
            background: #0f172a;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid #334155;
            padding: 3px;
        }
        .progress-bar {
            height: 22px;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear;
            text-align: right;
            line-height: 22px;
            font-size: 12px;
            font-weight: bold;
            color: #0f172a;
            padding-right: 8px;
            box-sizing: border-box;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 15px;
        }
        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button:hover { background: #0284c7; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚡ 실시간 타이핑 아레나</h2>
        
        <!-- 로비 화면 -->
        <div id="lobby" class="box">
            <label>닉네임:</label>
            <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" style="margin-bottom: 10px;">
            <label>방 코드:</label>
            <input type="text" id="roomInput" placeholder="예: room1" value="room1" style="margin-bottom: 15px;">
            <button onclick="joinRoom()">방 입장하기</button>
        </div>

        <!-- 게임 화면 -->
        <div id="gameRoom" class="hidden">
            <div class="stats">
                <span id="roomInfo">방: -</span>
                <span id="statDisplay">타수: 0 타/분 | 정확도: 100%</span>
            </div>

            <!-- 글자 하이라이팅 영역 -->
            <div id="sentenceDisplay">게임을 시작하면 문장이 표시됩니다.</div>

            <div class="box">
                <input type="text" id="typingInput" placeholder="시작 버튼을 누르면 입력할 수 있습니다." disabled oninput="checkTyping()">
            </div>

            <button id="startBtn" onclick="startGame()">게임 시작</button>

            <h3 style="margin-top: 25px; font-size: 16px; color: #cbd5e1;">실시간 진척도</h3>
            <div id="progressContainer"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = '';
        let targetText = '';
        let gameActive = false;
        let startTime = null;

        function joinRoom() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const room = document.getElementById('roomInput').value.trim();
            if (!nickname || !room) {
                alert('닉네임과 방 코드를 입력해주세요!');
                return;
            }
            currentRoom = room;
            socket.emit('join', { nickname: nickname, room: room });
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameRoom').classList.remove('hidden');
            document.getElementById('roomInfo').innerText = `방: ${room}`;
        }

        function startGame() {
            socket.emit('start_game', { room: currentRoom });
        }

        socket.ons("new_sentence", (data) => {
            targetText = data.sentence;
            gameActive = true;
            startTime = new Date().getTime(); // 게임 시작 시간 기록
            
            const input = document.getElementById('typingInput');
            input.value = '';
            input.disabled = false;
            input.focus();

            renderSentence(0);
            document.getElementById('statDisplay').innerText = "타수: 0 타/분 | 정확도: 100%";
        });

        // 화면에 문장을 글자별로 쪼개서 하이라이팅 입히기
        function renderSentence(currentIndex) {
            let html = '';
            for (let i = 0; i < targetText.length; i++) {
                if (i < currentIndex) {
                    html += `<span class="char-correct">${targetText[i]}</span>`;
                } else if (i === currentIndex) {
                    html += `<span class="char-normal" style="text-decoration: underline; color: #38bdf8;">${targetText[i]}</span>`;
                } else {
                    html += `<span class="char-normal">${targetText[i]}</span>`;
                }
            }
            document.getElementById('sentenceDisplay').innerHTML = html;
        }

        function checkTyping() {
            if (!gameActive) return;
            const typed = document.getElementById('typingInput').value;
            
            let correctCount = 0;
            let errorCount = 0;

            for (let i = 0; i < typed.length; i++) {
                if (i < targetText.length) {
                    if (typed[i] === targetText[i]) {
                        correctCount++;
                    } else {
                        errorCount++;
                    }
                }
            }

            renderSentence(typed.length);

            // 실시간 타수 및 정확도 계산
            const currentTime = new Date().getTime();
            const elapsedMinutes = (currentTime - startTime) / 60000; // 분 단위
            let cpm = elapsedMinutes > 0 ? Math.floor(correctCount / elapsedMinutes) : 0;
            let accuracy = typed.length > 0 ? Math.max(0, Math.floor(((typed.length - errorCount) / typed.length) * 100)) : 100;

            document.getElementById('statDisplay').innerText = `타수: ${cpm} 타/분 | 정확도: ${accuracy}%`;

            // 진척도(%) 계산
            let progress = Math.floor((correctCount / targetText.length) * 100);
            if (progress > 100) progress = 100;
            if (typed.length > 0 && progress === 0) progress = 1;

            socket.emit('update_progress', { room: currentRoom, progress: progress });

            // 완주 판정
            if (typed.trim() === targetText.trim()) {
                gameActive = false;
                document.getElementById('typingInput').disabled = true;
                alert('🎉 완주하셨습니다!');
            }
        }

        socket.on("update_progress", (data) => {
            const container = document.getElementById('progressContainer');
            container.innerHTML = '';
            for (let user in data) {
                let p = data[user];
                container.innerHTML += `
                    <div style="margin-bottom: 8px;">
                        <div style="font-size: 13px; margin-bottom: 3px; color: #cbd5e1;">${user}</div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${p}%;">${p}%</div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
