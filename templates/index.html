<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>실시간 멀티 타이핑 아레나</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body {
            background-color: #f1f5f9;
            color: #1e293b;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 700px;
            border: 1px solid #e2e8f0;
            position: relative;
        }
        h2 { text-align: center; color: #0284c7; margin-top: 0; }
        .box { margin-bottom: 20px; }
        label { font-weight: 600; color: #475569; }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            color: #1e293b;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }
        input[type="text"]:focus { border-color: #0ea5e9; background: #fff; }
        
        #sentenceDisplay {
            font-size: 18px;
            line-height: 1.8;
            background: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            word-break: break-all;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
            min-height: 60px;
        }
        .char-correct { color: #16a34a; font-weight: bold; background: #dcfce7; }
        .char-incorrect { color: #dc2626; font-weight: bold; background: #fee2e2; }
        .char-normal { color: #64748b; }

        .progress-container {
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
            padding: 3px;
        }
        .progress-bar {
            height: 22px;
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s linear;
            text-align: right;
            line-height: 22px;
            font-size: 12px;
            font-weight: bold;
            color: #ffffff;
            padding-right: 8px;
            box-sizing: border-box;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 15px;
            font-weight: 500;
        }
        .user-list {
            background: #f8fafc;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            margin-bottom: 15px;
            font-size: 14px;
            color: #334155;
        }
        button {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover { background: #0284c7; }
        .hidden { display: none !important; }

        /* 결과 모달 팝업 */
        #resultModal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            z-index: 100;
        }
        .modal-content {
            background: #ffffff;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            width: 350px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid #cbd5e1;
        }
        .modal-content h3 { color: #0284c7; margin-top: 0; font-size: 24px; }
        .result-stat-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            font-size: 16px;
            color: #334155;
            font-weight: 600;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 결과 팝업 모달 (기본적으로 반드시 숨김 처리) -->
        <div id="resultModal" class="hidden">
            <div class="modal-content">
                <h3 id="modalTitle">🎉 완주 축하합니다!</h3>
                <div class="result-stat-box" id="modalStatText">
                    타수: 0 타/분<br>정확도: 0%
                </div>
                <button onclick="closeModal()">확인</button>
            </div>
        </div>

        <h2>⚡ 실시간 타이핑 아레나</h2>
        
        <!-- 로비 화면 (초기 접속 시 표시) -->
        <div id="lobby" class="box">
            <label style="display:block; margin-bottom:5px;">닉네임:</label>
            <input type="text" id="nicknameInput" placeholder="닉네임을 입력하세요" style="margin-bottom: 15px;">
            <label style="display:block; margin-bottom:5px;">방 코드:</label>
            <input type="text" id="roomInput" placeholder="예: room1" value="room1" style="margin-bottom: 20px;">
            <button onclick="joinRoom()">방 입장하기</button>
        </div>

        <!-- 게임 방 화면 (초기 숨김) -->
        <div id="gameRoom" class="hidden">
            <div class="stats">
                <span id="roomInfo">방: -</span>
                <span id="statDisplay">타수: 0 타/분 | 정확도: 100%</span>
            </div>

            <div class="user-list">
                👥 접속한 참가자: <span id="userListDisplay">-</span>
            </div>

            <div id="sentenceDisplay">"게임 시작" 버튼을 누르면 문장이 출제됩니다!</div>

            <div class="box">
                <input type="text" id="typingInput" placeholder="시작 버튼을 누르면 타이핑할 수 있습니다." disabled oninput="checkTyping()">
            </div>

            <button id="startBtn" onclick="startGame()">게임 시작</button>

            <h3 style="margin-top: 20px; font-size: 15px; color: #334155; margin-bottom: 10px;">실시간 진척도</h3>
            <div id="progressContainer"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = '';
        let currentNickname = '';
        let targetText = '';
        let gameActive = false;
        let startTime = null;
        let finalCpm = 0;
        let finalAccuracy = 100;

        // 페이지 로드 시 팝업창 확실하게 숨기기
        document.addEventListener("DOMContentLoaded", () => {
            closeModal();
        });

        function joinRoom() {
            const nickname = document.getElementById('nicknameInput').value.trim();
            const room = document.getElementById('roomInput').value.trim();
            if (!nickname || !room) {
                alert('닉네임과 방 코드를 입력해주세요!');
                return;
            }
            currentNickname = nickname;
            currentRoom = room;
            
            socket.emit('join', { nickname: nickname, room: room });
            
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('gameRoom').classList.remove('hidden');
            document.getElementById('roomInfo').innerText = `방: ${room} (${nickname}님)`;
        }

        function startGame() {
            socket.emit('start_game', { room: currentRoom });
        }

        socket.on("update_users", (users) => {
            document.getElementById('userListDisplay').innerText = users.join(', ');
        });

        socket.on("new_sentence", (data) => {
            targetText = data.sentence;
            gameActive = true;
            startTime = new Date().getTime();
            
            closeModal();

            const input = document.getElementById('typingInput');
            input.value = '';
            input.disabled = false;
            input.focus();

            renderSentence(0, 0);
            document.getElementById('statDisplay').innerText = "타수: 0 타/분 | 정확도: 100%";
        });

        function renderSentence(typedLength, correctLength) {
            let html = '';
            const typedVal = document.getElementById('typingInput').value;

            for (let i = 0; i < targetText.length; i++) {
                if (i < typedVal.length) {
                    if (typedVal[i] === targetText[i]) {
                        html += `<span class="char-correct">${targetText[i]}</span>`;
                    } else {
                        html += `<span class="char-incorrect">${targetText[i]}</span>`;
                    }
                } else if (i === typedVal.length) {
                    html += `<span class="char-normal" style="text-decoration: underline; background: #e0f2fe; color: #0284c7;">${targetText[i]}</span>`;
                } else {
                    html += `<span class="char-normal">${targetText[i]}</span>`;
                }
            }
            document.getElementById('sentenceDisplay').innerHTML = html;
        }

        function checkTyping() {
            if (!gameActive || !targetText) return;
            const typed = document.getElementById('typingInput').value;
            
            let correctCount = 0;
            let errorCount = 0;

            for (let i = 0; i < typed.length; i++) {
                if (i < targetText.length) {
                    if (typed[i] === targetText[i]) {
                        correctCount++;
                    } else {
                        errorCount++;
                        break;
                    }
                }
            }

            renderSentence(typed.length, correctCount);

            const currentTime = new Date().getTime();
            const elapsedMinutes = (currentTime - startTime) / 60000;
            finalCpm = elapsedMinutes > 0 ? Math.floor(correctCount / elapsedMinutes) : 0;
            finalAccuracy = typed.length > 0 ? Math.max(0, Math.floor(((typed.length - errorCount) / typed.length) * 100)) : 100;

            document.getElementById('statDisplay').innerText = `타수: ${finalCpm} 타/분 | 정확도: ${finalAccuracy}%`;

            let progress = Math.floor((correctCount / targetText.length) * 100);
            if (progress > 100) progress = 100;

            socket.emit('user_progress', { room: currentRoom, nickname: currentNickname, progress: progress });

            // 게임 진행 중이고 문장 입력을 완료한 경우에만 팝업 실행
            if (targetText.length > 0 && typed.length > 0 && typed.trim() === targetText.trim()) {
                gameActive = false;
                document.getElementById('typingInput').disabled = true;

                socket.emit('finish_game', { 
                    room: currentRoom, 
                    nickname: currentNickname, 
                    cpm: finalCpm, 
                    accuracy: finalAccuracy 
                });

                showModal(`${currentNickname}님 완주!`, `타수: ${finalCpm} 타/분<br>정확도: ${finalAccuracy}%`);
            }
        }

        socket.on("player_finished", (data) => {
            if (data.nickname !== currentNickname) {
                showModal(`🏆 ${data.nickname}님 완주 완료!`, `상대방 기록<br>타수: ${data.cpm} 타/분 | 정확도: ${data.accuracy}%`);
            }
        });

        function showModal(title, statHtml) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalStatText').innerHTML = statHtml;
            document.getElementById('resultModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
        }

        socket.on("update_progress", (usersProgress) => {
            const container = document.getElementById('progressContainer');
            container.innerHTML = '';
            for (let user in usersProgress) {
                let p = usersProgress[user];
                container.innerHTML += `
                    <div style="margin-bottom: 8px;">
                        <div style="font-size: 13px; margin-bottom: 3px; font-weight: 600; color: #334155;">${user}</div>
                        <div class="progress-container">
                            <div class="progress-bar" style="width: ${p}%;">${p}%</div>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
